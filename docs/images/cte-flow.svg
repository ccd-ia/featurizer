<svg viewBox="0 0 880 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Flow of the six CTEs inside the lateral: the child is read and cut, transformed, aggregated; the target is read and cut, joined with the aggregates, transformed into the output" font-family="-apple-system,'Segoe UI',Roboto,sans-serif">
  <rect x="0.5" y="0.5" width="879" height="419" rx="12" fill="#ffffff" stroke="#d7dbe0"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" fill="#0f766e"/></marker></defs>
  <text x="24" y="30" font-size="14" fill="#1a2332" font-weight="700">The query for one config: one lateral per as-of date, six CTEs</text>
  <rect x="24" y="48" width="200" height="54" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="124" y="70" font-size="12.5" fill="#b45309" text-anchor="middle" font-weight="700" font-family="Menlo,Consolas,monospace">as_of_dates as aod</text>
  <text x="124" y="88" font-size="11" fill="#b45309" text-anchor="middle">one row per as-of date</text>
  <rect x="24" y="118" width="832" height="280" rx="12" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="40" y="140" font-size="11.5" fill="#b45309" font-weight="700" font-family="Menlo,Consolas,monospace">cross join lateral ( with … select * from customers_transform ) as t   — evaluated once per aod.as_of_date</text>
  <line x1="124" y1="102" x2="124" y2="118" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="40" y="158" width="250" height="96" rx="9" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <rect x="40" y="158" width="250" height="26" rx="9" fill="#0f766e"/>
  <rect x="40" y="176" width="250" height="8" fill="#0f766e"/>
  <text x="165.0" y="176" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="Menlo,Consolas,monospace">orders_synth</text>
  <text x="50" y="204" font-size="11.5" fill="#1a2332" font-family="Menlo,Consolas,monospace">read orders</text>
  <text x="50" y="221" font-size="11.5" fill="#1a2332" font-family="Menlo,Consolas,monospace">where ordered_at &lt;= aod.as_of_date</text>
  <text x="50" y="238" font-size="11.5" fill="#1a2332" font-family="Menlo,Consolas,monospace">identifiers + amount</text>
  <rect x="320" y="158" width="250" height="96" rx="9" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <rect x="320" y="158" width="250" height="26" rx="9" fill="#0f766e"/>
  <rect x="320" y="176" width="250" height="8" fill="#0f766e"/>
  <text x="445.0" y="176" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="Menlo,Consolas,monospace">orders_transform</text>
  <text x="330" y="204" font-size="11.5" fill="#1a2332" font-family="Menlo,Consolas,monospace">lag(amount) over (</text>
  <text x="330" y="221" font-size="11.5" fill="#1a2332" font-family="Menlo,Consolas,monospace">  partition by order_id</text>
  <text x="330" y="238" font-size="11.5" fill="#1a2332" font-family="Menlo,Consolas,monospace">  order by ordered_at, …)</text>
  <rect x="600" y="158" width="250" height="96" rx="9" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <rect x="600" y="158" width="250" height="26" rx="9" fill="#0f766e"/>
  <rect x="600" y="176" width="250" height="8" fill="#0f766e"/>
  <text x="725.0" y="176" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="Menlo,Consolas,monospace">orders_aggs_for_customers</text>
  <text x="610" y="204" font-size="11.5" fill="#1a2332" font-family="Menlo,Consolas,monospace">group by customer_id</text>
  <text x="610" y="221" font-size="11.5" fill="#1a2332" font-family="Menlo,Consolas,monospace">count(order_id), sum(amount)</text>
  <text x="610" y="238" font-size="11.5" fill="#1a2332" font-family="Menlo,Consolas,monospace">filter (where daterange(…))</text>
  <line x1="290" y1="206" x2="320" y2="206" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="570" y1="206" x2="600" y2="206" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="600" y="288" width="250" height="96" rx="9" fill="#ccfbf1" stroke="#134e4a" stroke-width="1.5"/>
  <rect x="600" y="288" width="250" height="26" rx="9" fill="#134e4a"/>
  <rect x="600" y="306" width="250" height="8" fill="#134e4a"/>
  <text x="725.0" y="306" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="Menlo,Consolas,monospace">customers_synth</text>
  <text x="610" y="334" font-size="11.5" fill="#1a2332" font-family="Menlo,Consolas,monospace">read customers</text>
  <text x="610" y="351" font-size="11.5" fill="#1a2332" font-family="Menlo,Consolas,monospace">left join the aggregates</text>
  <text x="610" y="368" font-size="11.5" fill="#1a2332" font-family="Menlo,Consolas,monospace">where signed_up &lt;= aod.as_of_date</text>
  <rect x="320" y="288" width="250" height="96" rx="9" fill="#ccfbf1" stroke="#134e4a" stroke-width="1.5"/>
  <rect x="320" y="288" width="250" height="26" rx="9" fill="#134e4a"/>
  <rect x="320" y="306" width="250" height="8" fill="#134e4a"/>
  <text x="445.0" y="306" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="Menlo,Consolas,monospace">customers_transform</text>
  <text x="330" y="334" font-size="11.5" fill="#1a2332" font-family="Menlo,Consolas,monospace">lag(…) over (partition by</text>
  <text x="330" y="351" font-size="11.5" fill="#1a2332" font-family="Menlo,Consolas,monospace">  customer_id order by …)</text>
  <text x="330" y="368" font-size="11.5" fill="#1a2332" font-family="Menlo,Consolas,monospace">one-hots · the output columns</text>
  <rect x="40" y="288" width="250" height="96" rx="9" fill="#ccfbf1" stroke="#134e4a" stroke-width="1.5"/>
  <rect x="40" y="288" width="250" height="26" rx="9" fill="#134e4a"/>
  <rect x="40" y="306" width="250" height="8" fill="#134e4a"/>
  <text x="165.0" y="306" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="Menlo,Consolas,monospace">select * from customers_transform</text>
  <text x="50" y="334" font-size="11.5" fill="#1a2332" font-family="Menlo,Consolas,monospace">as t: (as_of_date, customer_id, …)</text>
  <text x="50" y="351" font-size="11.5" fill="#1a2332" font-family="Menlo,Consolas,monospace">the executor indexes the frame</text>
  <text x="50" y="368" font-size="11.5" fill="#1a2332" font-family="Menlo,Consolas,monospace">by (as_of_date, customer_id)</text>
  <line x1="725" y1="254" x2="725" y2="288" stroke="#134e4a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="600" y1="336" x2="570" y2="336" stroke="#134e4a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="320" y1="336" x2="290" y2="336" stroke="#134e4a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="735" y="274" font-size="10.5" fill="#134e4a">left join on customer_id</text>
</svg>
