<svg viewBox="0 0 880 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Timeline of one game and its home team's earlier games: paired with the day before, the game's row is emitted and only the team's rows before that day are read" font-family="-apple-system,'Segoe UI',Roboto,sans-serif">
  <rect x="0.5" y="0.5" width="879" height="419" rx="12" fill="#ffffff" stroke="#d7dbe0"/>
  <text x="24" y="30" font-size="14" fill="#1a2332" font-weight="700">One row per event: a game scored with what was known the day before</text>
  <line x1="525.0" y1="56" x2="525.0" y2="350" stroke="#b45309" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="519.0" y="62" font-size="11.5" fill="#b45309" text-anchor="end" font-weight="700" font-family="Menlo,Consolas,monospace">as_of_date = 2024-03-07</text>
  <text x="519.0" y="78" font-size="11" fill="#b45309" text-anchor="end" font-family="Menlo,Consolas,monospace">(played_on - 1)</text>
  <line x1="70" y1="350" x2="840" y2="350" stroke="#1a2332" stroke-width="1.4"/>
  <line x1="157.5" y1="346" x2="157.5" y2="354" stroke="#1a2332" stroke-width="1.2"/>
  <text x="157.5" y="370" font-size="11" fill="#5b6472" text-anchor="middle">Feb 15</text>
  <line x1="420.0" y1="346" x2="420.0" y2="354" stroke="#1a2332" stroke-width="1.2"/>
  <text x="420.0" y="370" font-size="11" fill="#5b6472" text-anchor="middle">Mar 1</text>
  <line x1="665.0" y1="346" x2="665.0" y2="354" stroke="#1a2332" stroke-width="1.2"/>
  <text x="665.0" y="370" font-size="11" fill="#5b6472" text-anchor="middle">Mar 15</text>
  <line x1="70" y1="130" x2="840" y2="130" stroke="#d7dbe0" stroke-width="1"/>
  <text x="70" y="116" font-size="11.5" fill="#1a2332" font-weight="700">games · target, no temporal_ix  ·  game_id 3, played_on 2024-03-08, home_id 100</text>
  <rect x="535.5" y="123.0" width="14" height="14" rx="2" fill="#b45309"/>
  <text x="554.5" y="134" font-size="10.5" fill="#b45309">the pair (2024-03-07, 3): this row is emitted</text>
  <line x1="70" y1="230" x2="840" y2="230" stroke="#d7dbe0" stroke-width="1"/>
  <text x="70" y="216" font-size="11.5" fill="#1a2332" font-weight="700">team_games · child, temporal_ix played_on  ·  team_id 100</text>
  <circle cx="245.0" cy="230" r="6" fill="#0f766e"/>
  <text x="245.0" y="254" font-size="10.5" fill="#0f766e" text-anchor="middle" font-family="Menlo,Consolas,monospace">goals 3</text>
  <circle cx="420.0" cy="230" r="6" fill="#0f766e"/>
  <text x="420.0" y="254" font-size="10.5" fill="#0f766e" text-anchor="middle" font-family="Menlo,Consolas,monospace">goals 1</text>
  <circle cx="542.5" cy="230" r="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="3 2"/>
  <text x="542.5" y="254" font-size="10.5" fill="#b91c1c" text-anchor="middle" font-family="Menlo,Consolas,monospace">goals 4</text>
  <text x="554.5" y="220" font-size="10" fill="#b91c1c">the game's own day</text>
  <circle cx="665.0" cy="230" r="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="3 2"/>
  <text x="665.0" y="254" font-size="10.5" fill="#b91c1c" text-anchor="middle" font-family="Menlo,Consolas,monospace">goals 2</text>
  <text x="677.0" y="220" font-size="10" fill="#b91c1c">later</text>
  <text x="70" y="300" font-size="11.5" fill="#1a2332" font-family="Menlo,Consolas,monospace">COUNT(home.played_on) = 2    MEAN(home.goals) = 2.0</text>
  <text x="70" y="320" font-size="11" fill="#5b6472">Paired with its own date, with a temporal_ix on the</text>
  <text x="70" y="336" font-size="11" fill="#5b6472">target, the 2024-03-08 row is read too (COUNT = 3).</text>
  <text x="70" y="394" font-size="11.5" fill="#b45309" font-family="Menlo,Consolas,monospace">as_of_dates:  select played_on - 1 as as_of_date, game_id as cohort_id from games</text>
</svg>
