  <text x="650.7" y="172" font-size="10.5" fill="#b91c1c" text-anchor="middle">not read</text>
  <text x="666.4" y="262" font-size="10.5" fill="#b91c1c" text-anchor="middle">row not emitted (ADR-0017)</text>
  <text x="783.2" y="262" font-size="10.5" fill="#b91c1c" text-anchor="middle">not read</text>
  <text x="70" y="296" font-size="11.5" fill="#1a2332" font-family="Menlo,Consolas,monospace">customer 1:  COUNT(orders.order_id) = 2 · |interval=P30D = 1</text>
  <text x="70" y="312" font-size="11.5" fill="#1a2332" font-family="Menlo,Consolas,monospace">customer 2:  no row under this date</text>
  <circle cx="80" cy="372" r="5" fill="#0f766e"/>
  <text x="92" y="376" font-size="11" fill="#5b6472">read: temporal_ix &lt;= aod.as_of_date</text>
  <circle cx="330" cy="372" r="5" fill="#ffffff" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="3 2"/>
  <text x="342" y="376" font-size="11" fill="#5b6472">dated after the as-of date: never read</text>
  <rect x="594.5" y="366.5" width="11" height="11" rx="2" fill="#b45309"/>
  <text x="612" y="376" font-size="11" fill="#5b6472">target row emitted</text>
  <rect x="739.5" y="366.5" width="11" height="11" rx="2" fill="#ffffff" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="3 2"/>
  <text x="757" y="376" font-size="11" fill="#5b6472">not emitted</text>
</svg>
