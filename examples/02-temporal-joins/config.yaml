# Healthcare feature generation: two relationships, two directions.
#
#   patients <- care_plans          aggregation  (care_plans is the CHILD)
#   risk_assessments -> patients    as-of lookup (risk_assessments is the PARENT)
#
# The `temporal:` block is read only on the second kind. Declared on the first
# it is discarded, and validation says so.

target: patients
max_depth: 2

intervals:
  - P30D  # Last 30 days
  - P90D  # Last 90 days

# A focused primitive set (the full default set would exceed PostgreSQL's 1664
# columns-per-row limit on this config). Includes the rolling ordered-set stats
# — rolling_median / rolling_iqr render as correlated subqueries (PostgreSQL
# forbids OVER on percentile_cont), exercised end to end here.
aggregations:
  - count
  - sum
  - mean
  - min
  - max
  - stddev
  - median
transformations:
  - identity
  - abs
  - lag_1
  - rolling_mean_7
  - rolling_median_7
  - rolling_iqr_7

entities:
  - alias: patients
    id: patient_id
    table: patients
    temporal_ix: admission_date
    variables:
      age:
        type: numeric
      severity_level:
        type: categorical

  - alias: care_plans
    id: plan_id
    table: care_plans
    temporal_ix: plan_date
    variables:
      treatment_type:
        type: categorical
      cost:
        type: numeric

  - alias: risk_assessments
    id: assessment_id
    table: risk_assessments
    temporal_ix: assessed_on
    variables:
      risk_score:
        type: numeric

relationships:
  # Aggregation. patients is the parent and the target, so its care plans roll
  # up onto it. Every read of care_plans is already bounded by the as-of date;
  # no `temporal:` block belongs here.
  - parent:
      entity: patients
      key: patient_id
    child:
      entity: care_plans
      key: patient_id

  # As-of lookup. The timestamped lookup table is the PARENT and the entity
  # receiving the value is the CHILD: each patient row pulls the most recent
  # assessment dated at or before its own admission_date.
  - parent:
      entity: risk_assessments
      key: patient_id
    child:
      entity: patients
      key: patient_id
    temporal:
      mode: as_of
      grace: P30D  # Lookback cap: ignore assessments older than 30 days
